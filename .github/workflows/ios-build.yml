name: Build Unsigned iOS IPA (WorkTrack)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: "是否自动创建 GitHub Release 并附带 IPA 安装包"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release 版本标签 (例如 v1.0.0，仅当开启创建 Release 时生效)"
        required: false
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build WorkTrack Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install or Verify XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate
          ls -la WorkTrack.xcodeproj

      - name: Show Xcode & SDK Versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Unsigned Release App (iphoneos)
        run: |
          xcodebuild build \
            -project WorkTrack.xcodeproj \
            -scheme WorkTrack \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Native Full-Screen Info.plist Keys
        run: |
          PLIST="build/Build/Products/Release-iphoneos/WorkTrack.app/Info.plist"
          plutil -p "$PLIST"
          plutil -p "$PLIST" | grep -q '"UILaunchScreen"'
          plutil -p "$PLIST" | grep -q '"NSPhotoLibraryUsageDescription"'
          plutil -p "$PLIST" | grep -q '"UISupportedInterfaceOrientations"'

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorkTrack.app Payload/
          zip -qry WorkTrack-Unsigned.ipa Payload
          rm -rf Payload
          ls -lh WorkTrack-Unsigned.ipa

      - name: Upload WorkTrack-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTrack-Unsigned-IPA
          path: WorkTrack-Unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (On Tag v* or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ inputs.release_tag }}"
          fi
          echo "Publishing Release for tag: $TAG_NAME"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "WorkTrack $TAG_NAME (iOS 27.2.1 液态玻璃工作追踪)" \
              --notes "WorkTrack 免签名安装包（适用于 Sideloadly / SideStore 免费 Apple ID 自签安装）。"
          gh release upload "$TAG_NAME" WorkTrack-Unsigned.ipa --clobber
