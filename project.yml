name: WorkTrack
options:
  bundleIdPrefix: com.worktrack.app
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  WorkTrack:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WorkTrack
        excludes:
          - "Info.plist"
          - "**/Info.plist"
    scheme:
      testTargets:
        - WorkTrackTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worktrack.personal.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WorkTrack/Info.plist
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 3
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  WorkTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WorkTrackTests
    dependencies:
      - target: WorkTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.worktrack.personal.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkTrack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WorkTrack"
        BUNDLE_LOADER: "$(TEST_HOST)"
